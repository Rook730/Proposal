name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[native,dev]" pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Build one-file exe
        run: python packaging/build.py

      - name: Build folder version
        run: |
          python packaging/build.py --onedir
          Remove-Item -ErrorAction SilentlyContinue "dist/KeptSpec Proposal Builder/selftest.log"
          Compress-Archive -Path "dist/KeptSpec Proposal Builder" -DestinationPath "dist/KeptSpec-Proposal-Builder-folder.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: KeptSpec-Proposal-Builder
          path: |
            dist/KeptSpec Proposal Builder.exe
            dist/KeptSpec-Proposal-Builder-folder.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >
          gh release create "$env:TAG" --target "${{ github.sha }}"
          "dist/KeptSpec Proposal Builder.exe#KeptSpec Proposal Builder.exe"
          "dist/KeptSpec-Proposal-Builder-folder.zip"
          --title "Proposal Builder $env:TAG"
          --notes-file docs/RELEASE_NOTES.md
