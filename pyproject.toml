[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proposal-builder"
version = "1.5.1"
description = "Proposal builder for Kept Spec Advisors"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.0,<4",
    "pydantic>=2.7,<3",
    "openpyxl>=3.1",
    "typst>=0.13",
]

[project.optional-dependencies]
native = ["pywebview>=5"]
dev = ["pytest>=8", "pypdf>=4"]

[project.scripts]
proposal-builder = "proposal_builder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proposal_builder = ["seed/*.json", "seed/*.png", "render/templates/*.typ", "render/fonts/*", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
